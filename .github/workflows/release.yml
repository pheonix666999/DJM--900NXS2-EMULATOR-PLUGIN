name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: ci-windows
            test: test-windows
            label: Windows-x64
          - os: macos-14
            preset: ci-macos
            test: test-macos
            label: macOS-Universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
          submodules: recursive
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.test }} --output-on-failure
      - name: Stage Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem out -Recurse -Filter 'QuadBeat FX.exe' | Select-Object -First 1
          if (-not $exe) { throw "Missing executable" }
          $vst3 = Get-ChildItem out -Recurse -Directory -Filter 'QuadBeat FX.vst3' | Select-Object -First 1
          if (-not $vst3) { throw "Missing VST3 bundle" }
          New-Item -Type Directory -Force "release/QuadBeatFX" | Out-Null
          Copy-Item $exe.FullName release/QuadBeatFX/
          Copy-Item $vst3.FullName release/QuadBeatFX/ -Recurse
          Copy-Item README.md,INSTALL-VST3-WINDOWS.txt,Install-QuadBeatFX-VST3.cmd,Install-QuadBeatFX-VST3.ps1,LICENSE.md,THIRD_PARTY_NOTICES.md release/QuadBeatFX/
          Compress-Archive release/QuadBeatFX/* release/QuadBeatFX-Windows-x64.zip
          (Get-FileHash release/QuadBeatFX-Windows-x64.zip -Algorithm SHA256).Hash |
            Set-Content release/QuadBeatFX-Windows-x64.zip.sha256
      - name: Stage macOS
        if: runner.os == 'macOS'
        run: |
          APP="$(find out -name 'QuadBeat FX.app' -type d | head -1)"
          VST3="$(find out -name 'QuadBeat FX.vst3' -type d | head -1)"
          test -n "$APP"
          test -n "$VST3"
          lipo -info "$APP/Contents/MacOS/QuadBeat FX" | grep arm64
          lipo -info "$APP/Contents/MacOS/QuadBeat FX" | grep x86_64
          lipo -info "$VST3/Contents/MacOS/QuadBeat FX" | grep arm64
          lipo -info "$VST3/Contents/MacOS/QuadBeat FX" | grep x86_64
          codesign --force --deep --sign - "$APP"
          codesign --force --deep --sign - "$VST3"
          mkdir -p release/QuadBeatFX
          cp -R "$APP" "$VST3" release/QuadBeatFX/
          cp README.md LICENSE.md THIRD_PARTY_NOTICES.md release/QuadBeatFX/
          ditto -c -k --keepParent release/QuadBeatFX release/QuadBeatFX-macOS-Universal.zip
          shasum -a 256 release/QuadBeatFX-macOS-Universal.zip \
            > release/QuadBeatFX-macOS-Universal.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: QuadBeatFX-${{ matrix.label }}
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "QuadBeat FX $TAG" \
              --notes "Unsigned Windows and macOS builds. See included licensing notices."
          gh release upload "$TAG" release/* --clobber
